[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmproof"
version = "0.1.0"
description = "Universal Multi-Agent Verification & Truth Oracle Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GrowthWebDev", email = "dev@growthwebdev.com" }]
keywords = ["agents", "verification", "tdd", "oracle", "testing", "anti-hallucination", "swarm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
swarmproof = "swarmproof.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarmproof*"]
