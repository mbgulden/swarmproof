[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmproof"
version = "0.3.0"
description = "Universal Multi-Agent Verification & Truth Oracle Engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Michael Gulden", email = "michael@growthwebdev.com" }]
keywords = ["agents", "verification", "tdd", "oracle", "testing", "anti-hallucination", "swarm", "ai-agents", "llm-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
]

[project.scripts]
swarmproof = "swarmproof.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarmproof*"]

[tool.setuptools.package-data]
swarmproof = ["py.typed"]

[project.urls]
Homepage = "https://github.com/mbgulden/swarmproof"
Repository = "https://github.com/mbgulden/swarmproof"
Issues = "https://github.com/mbgulden/swarmproof/issues"
Changelog = "https://github.com/mbgulden/swarmproof/blob/main/CHANGELOG.md"

